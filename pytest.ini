"""
⚙️ PROJETO: CONFIGURAÇÃO DE TESTES (PYTEST.INI)
🎯 Objetivo: Educacional - Automatizar e padronizar a execução dos testes.

ESTRUTURA DO ARQUIVO:
1. VÍNCULO COM DJANGO: Aponta para as configurações do sistema.
2. PADRONIZAÇÃO: Define quais arquivos serão reconhecidos como testes.
3. AMBIENTE: Garante que o Python encontre os módulos do projeto.
"""

[pytest]
# 1. VÍNCULO COM O DJANGO
# Define qual arquivo de settings o pytest deve carregar para simular o site.
DJANGO_SETTINGS_MODULE = portfolio.settings

# 2. PADRÃO DE NOMENCLATURA
# Diz ao pytest para buscar testes nestes formatos de arquivo. 
# Isso permite que você organize seus testes como preferir.
python_files = tests.py test_*.py *_tests.py

# 3. CAMINHO DO PROJETO (PYTHONPATH)
# Garante que a raiz do projeto (.) esteja no caminho de busca do Python.
# Isso evita erros de "ModuleNotFoundError" ao importar suas views ou models.
pythonpath = .